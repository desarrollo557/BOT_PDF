name: Mejora
description: Algo que el sistema todavía no hace
labels: [mejora]
body:
  - type: textarea
    id: necesidad
    attributes:
      label: Qué se necesita y para qué
      description: El trabajo del operador que hoy no se puede hacer, o cuesta de más.
    validations:
      required: true
  - type: textarea
    id: hecho
    attributes:
      label: Cuándo está terminado
      description: Cómo se comprueba, en concreto, que quedó resuelto.
    validations:
      required: true
