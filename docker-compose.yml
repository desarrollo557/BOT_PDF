# BOT_PDF con Docker. Se arranca con scripts/instalar-escritorio.ps1 (Windows)
# o scripts/instalar-escritorio.sh (Linux), que además montan los discos del
# equipo en docker-compose.override.yml: con eso las rutas locales -- pegar
# «C:\Users\...\ENTRADA» o elegirla en el explorador de la pantalla -- funcionan
# igual que sin Docker. Ver la sección «Con Docker» del README.
name: botpdf

services:
  botpdf:
    build:
      context: .
      dockerfile: Dockerfile
    image: botpdf:latest
    container_name: botpdf
    ports:
      # El del equipo: 8000, u otro con BOTPDF_PUERTO en el .env (instalar-docker -Puerto).
      - "${BOTPDF_PUERTO:-8000}:8000"
    # Las llaves de la IA (MISTRAL_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY) y
    # los ajustes RESOLUTIONS_* opcionales, del .env de la raíz si existe.
    env_file:
      - path: .env
        required: false
    # Lo propio del contenedor manda sobre el .env: una ruta de Windows ahí
    # (la de Tesseract, las carpetas de datos) dentro de Linux no existe.
    environment:
      RESOLUTIONS_DATA_DIR: /data
      RESOLUTIONS_UPLOAD_DIR: /data/uploads
      RESOLUTIONS_OUTPUT_DIR: /data/outputs
      RESOLUTIONS_LEDGER: /data/inventory.jsonl
      RESOLUTIONS_USERS: /data/usuarios.jsonl
      RESOLUTIONS_LOG_DIR: /data/logs
      RESOLUTIONS_TESSERACT_CMD: tesseract
      BOTPDF_WEB_ROOT: /app/web/build
      # El nombre del PC en la corrida compartida (varios equipos sobre el mismo
      # destino, 2026-11-25): sin él, el del contenedor, que nadie reconoce.
      BOTPDF_EQUIPO: ${COMPUTERNAME:-}
      # auto (por omisión): se coordina con los demás equipos del destino;
      # si: o se coordina o no corre; no: un equipo solo, como antes.
      BOTPDF_COORDINACION: ${BOTPDF_COORDINACION:-auto}
      # Los mismos procesos en todos los equipos (el operador, 2026-11-25:
      # «la misma cantidad de procesos en todas las imágenes»): sin esto salían
      # de los procesadores que Docker deja ver en cada PC, y tras actualizar
      # Docker Desktop un equipo de 32 hilos ofrecía «1, 2, 3» en vez de hasta
      # 31. Tope de «Archivos en paralelo» y lo que hace «Auto». Un equipo más
      # chico puede bajarlos en su .env.
      RESOLUTIONS_DOCUMENT_WORKERS: ${RESOLUTIONS_DOCUMENT_WORKERS:-31}
      RESOLUTIONS_FOLDER_DOCUMENTS: ${RESOLUTIONS_FOLDER_DOCUMENTS:-8}
      # Cuántas entregas escriben a la vez en el destino (2026-11-26): a NIC
      # distintos van juntas; al mismo NIC, de una en una. Si el servidor del
      # destino se ahoga (renombres de varios segundos), se baja en el .env.
      RESOLUTIONS_ENTREGAS_A_LA_VEZ: ${RESOLUTIONS_ENTREGAS_A_LA_VEZ:-4}
      # Cuántos Tesseract leen a la vez en todo el equipo (2026-11-26): vacío es
      # automático, los núcleos que ve Docker menos uno. Sin tope, en un PC
      # sobrecargado Tesseract pasaba de 90 s y la página se pagaba a Mistral.
      RESOLUTIONS_TESSERACT_A_LA_VEZ: ${RESOLUTIONS_TESSERACT_A_LA_VEZ:-}
    volumes:
      - botpdf_data:/data
    restart: unless-stopped

volumes:
  botpdf_data:
    # Con nombre fijo: sobrevive a parar, reconstruir y volver a clonar el repo
    # en otra carpeta. Es el nombre que ya tenía en un clon llamado BOT_PDF.
    name: bot_pdf_botpdf_data
