[project]
name = "resolutions"
version = "0.1.0"
description = "High-throughput PDF splitter that groups pages by resolution code"
requires-python = ">=3.12"

# The domain layer has ZERO runtime dependencies on purpose.
# Everything below is only needed by adapters and the HTTP layer.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
